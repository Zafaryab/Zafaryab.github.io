<!-- photography.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zafaryab Haider // Lens</title>
  <meta name="description" content="Photography portfolio of Zafaryab Haider — landscapes, campus, and moments." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://code.jquery.com" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="page-photography">
  <span id="top"></span>
  <div id="header-placeholder"></div>

  <main>
    <section class="section--tight">
      <div class="wrap">
        <div class="hero-id"><span class="n">05</span> / PHOTOGRAPHY</div>
        <div class="entry-head" style="align-items:flex-end;">
          <div>
            <h1 class="display" style="font-size:clamp(1.9rem,4.5vw,2.7rem);">LENS</h1>
            <p class="hero-lead" style="margin:.9rem 0 0;">Landscapes, campus, and quiet moments. Select any frame to view full size.</p>
          </div>
          <a class="act" href="https://instagram.com/zhaider_lens" target="_blank" rel="noopener noreferrer">Instagram <span class="arw">↗</span></a>
        </div>
      </div>
    </section>

    <section class="section--tight" style="padding-top:0;">
      <div class="wrap">
        <div class="sec-head">
          <div class="sec-label"><span class="n">01</span><span class="slash">/</span>GALLERY</div>
          <span class="line"></span>
        </div>

        <div class="filter-bar">
          <div class="filter-item">
            <label for="collectionSelect">// Collection</label>
            <select id="collectionSelect"></select>
          </div>
          <div class="filter-item">
            <label for="tagSelect">// Tag</label>
            <select id="tagSelect"></select>
          </div>
          <button class="act" id="clearFiltersBtn" type="button">Reset <span class="arw">×</span></button>
          <div class="filter-meta" id="galleryMeta"></div>
        </div>

        <div class="gallery" id="galleryGrid"></div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>
  <script src="js/site.js"></script>
  <script src="js/gallery.js"></script>

  <script>
    if (window.lightbox) {
      lightbox.option({
        resizeDuration: 200,
        wrapAround: true,
        fadeDuration: 200,
        imageFadeDuration: 200,
        showImageNumberLabel: false,
        alwaysShowNavOnTouchDevices: true
      });
    }
  </script>
</body>
</html>
