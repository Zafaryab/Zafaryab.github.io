<!-- photography.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zafaryab Haider // Lens</title>
  <meta name="description" content="Photography portfolio of Zafaryab Haider — landscapes, campus, and moments." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://code.jquery.com" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.snapseed-matte.css" />
</head>

<body class="page-photography">
  <span id="top"></span>
  <div id="header-placeholder"></div>

  <main>
    <!-- GALLERY CONSOLE HEADER -->
    <section class="hero">
      <div class="wrap">
        <div class="dash">
          <div class="dash-bar">
            <span><span class="n">05</span> / LENS</span>
            <span class="r">FRAME.SYSTEM</span>
          </div>

          <div class="dash-main dash-main--lens">
            <div class="dash-profile">
              <h1 class="cv-title">LENS</h1>
              <p class="cv-interest" style="margin:var(--s-related) 0 var(--s-module);">
                Landscapes, campus, and quiet moments. Select any frame to view full size.
              </p>
              <div class="acts" style="margin-top:auto;">
                <a class="act" href="https://instagram.com/zhaider_lens" target="_blank" rel="noopener noreferrer">Instagram <span class="arw">↗</span></a>
              </div>
            </div>

            <div class="lens-controls">
              <div class="lens-ctrl">
                <label class="k" for="collectionSelect">// Collection</label>
                <select id="collectionSelect"></select>
              </div>
              <div class="lens-ctrl">
                <span class="k">// Showing</span>
                <span class="val" id="galleryMeta"></span>
              </div>
              <div class="lens-ctrl">
                <label class="k" for="tagSelect">// Tag</label>
                <select id="tagSelect"></select>
              </div>
              <div class="lens-ctrl">
                <span class="k">// Filter</span>
                <button class="act" id="clearFiltersBtn" type="button">Reset <span class="arw">×</span></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- GALLERY -->
    <section class="section--tight" style="padding-top:0;">
      <div class="wrap">
        <div class="gallery" id="galleryGrid"></div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>
  <script src="js/site.js"></script>
  <script src="js/gallery.js"></script>

  <script>
    if (window.lightbox) {
      lightbox.option({
        resizeDuration: 200,
        wrapAround: true,
        fadeDuration: 200,
        imageFadeDuration: 200,
        showImageNumberLabel: false,
        alwaysShowNavOnTouchDevices: true
      });
    }
  </script>
</body>
</html>
